# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "ayame_paperdoll"
mod.name = "Ayame PaperDoll"
mod.group = "org.ayamemc.ayamepaperdoll"
mod.version = "4.5.0"
# File names of the jars: ayame-paperdoll-<loader>-<version>+<minecraft>.jar
mod.archives_name = "ayame-paperdoll"

# Project IDs for `publishMods` (see .github/workflows/build.yml). Leave one empty to skip that site.
publish.modrinth = ""
publish.curseforge = ""

deps.fabric_loader = "0.19.3"
# Bundled into the Forge jars before 1.21.10; Fabric, NeoForge and newer Forge ship it themselves
deps.mixinextras = "0.5.3"
loomx.loom_version = "1.17-SNAPSHOT"

# Sections:
#   [fabric."<version>"]     - mod.mc_compat uses Fabric's range syntax
#   [neoforge."<version>"]   - mod.mc_compat uses Maven range syntax
#   [forge."<version>"]      - deps.forge is written as `<minecraft>-<forge>`, the way the Forge maven names it
# mod.mc_releases lists the releases a jar is marked compatible with on Modrinth and CurseForge.

[fabric."1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]
mod.mc_compat = ">=1.21 <=1.21.1"
deps.fabric_api = "0.116.17+1.21.1"
deps.modmenu = "11.0.5"

[neoforge."1.21.1"]
mod.mc_releases = ["1.21.1"]
mod.mc_compat = "[1.21.1]"
deps.neoforge = "21.1.203"

