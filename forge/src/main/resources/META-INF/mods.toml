modLoader = "javafml"
loaderVersion = "[0,)"
issueTrackerURL = "${mod_issues_url}"
license = "${mod_license}"
# Purely client-side: not loaded on dedicated servers, and servers don't need it installed
clientSideOnly = true

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "${mod_homepage_url}"
authors = '''
LucunJi(Original author)
HappyRespawnanchor
'''
credits = '''
Fallen_Breath
X-Green
altrisi
plusls
pertaz
LightgraycaAT
'''
description = '''${mod_description}'''
logoFile = "icon.png"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${forge_minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"
