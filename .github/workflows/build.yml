name: Probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ base, no_at, no_jij, none ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          chmod +x gradlew
          case "${{ matrix.variant }}" in
            no_at) export PROBE_NO_AT=1 ;;
            no_jij) export PROBE_NO_JIJ=1 ;;
            none) export PROBE_NO_AT=1 PROBE_NO_JIJ=1 ;;
          esac
          ./gradlew :1.21.1-forge:compileJava --stacktrace 2>&1 | grep -v "DefaultConfigurableFileCollection" | tail -150
          exit ${PIPESTATUS[0]}
