name: Build

# Builds the mod for every Minecraft version (1.21.1 - 26.3) on Fabric (also runs on Quilt),
# NeoForge and Forge: one job per loader, every version in it. Publishing a GitHub release
# attaches all the jars to it. A push to main that changes mod.version also uploads the jars
# to Modrinth and CurseForge and creates a GitHub release (tag v<mod.version>) with the jars.
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # On main a push waits for the running build instead of cancelling it (every run publishes or dry-runs)
  cancel-in-progress: ${{ github.event_name != 'release' && github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build (${{ matrix.loader }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Every loader computes the same values, so it doesn't matter which leg sets them
    outputs:
      version-changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.version.outputs.changelog }}
    strategy:
      fail-fast: false
      matrix:
        loader: [ fabric, neoforge, forge ]
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, to compare mod.version with the previous push and build the changelog
          fetch-depth: 0

      # 1.21.x builds target Java 21, 26.x targets Java 25
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      # Caches ~/.gradle, including the decompiled Minecraft of every node
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build every Minecraft version
        run: |
          chmod +x gradlew
          task="build$(echo '${{ matrix.loader }}' | sed 's/./\U&/')"
          ./gradlew "$task" --stacktrace

      - name: Upload jars
        uses: actions/upload-artifact@v7
        with:
          name: kartoneks-paperdoll-${{ matrix.loader }}
          path: build/libs/*/*.jar
          if-no-files-found: error

      - name: Check whether mod.version changed
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read_version() { sed -n 's/^mod\.version *= *"\(.*\)"/\1/p'; }
          current=$(read_version < stonecutter.properties.toml)
          previous=$(git show "$BEFORE:stonecutter.properties.toml" 2>/dev/null | read_version || true)
          echo "Version: '$previous' -> '$current'"
          if [ -n "$current" ] && [ "$current" != "$previous" ]; then
            changelog=$(git log --no-merges --format='- %s' "$BEFORE..$GITHUB_SHA" 2>/dev/null || echo "- Version $current")
            {
              echo "changed=true"
              echo "version=$current"
              echo "changelog<<CHANGELOG_EOF"
              echo "$changelog"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "PUBLISH_CHANGELOG<<CHANGELOG_EOF"
              echo "$changelog"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_ENV"
          fi

      # Tokens are repository secrets: GitHub masks them in logs and never hands them to pull requests from forks
      - name: Publish to Modrinth and CurseForge
        if: steps.version.outputs.changed == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: ./gradlew "publish$(echo '${{ matrix.loader }}' | sed 's/./\U&/')" --stacktrace

      # Every other run checks the publishing setup without uploading anything (no token = dry run)
      - name: Publish dry run
        if: steps.version.outputs.changed != 'true'
        run: ./gradlew "publish$(echo '${{ matrix.loader }}' | sed 's/./\U&/')" --stacktrace

  # Publishing a release attaches the jars to it; a mod.version change on main creates release
  # v<version> with the jars (a release made with GITHUB_TOKEN doesn't start another run)
  release:
    name: Attach jars to the release
    needs: build
    if: github.event_name == 'release' || needs.build.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: jars
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANGELOG: ${{ needs.build.outputs.changelog }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="v$VERSION"
            # Re-running the job reuses the release instead of failing on it
            gh release view "$tag" > /dev/null 2>&1 \
              || gh release create "$tag" --target "$GITHUB_SHA" --title "$VERSION" --notes "$CHANGELOG"
          fi
          find jars -name '*.jar' -print0 | xargs -0 gh release upload "$tag" --clobber
