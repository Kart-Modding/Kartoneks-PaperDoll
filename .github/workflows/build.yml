name: Probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [ setfrom, default ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v6
      - run: |
          chmod +x gradlew
          export PROBE_AT=${{ matrix.variant }}
          ./gradlew :1.21.1-forge:compileJava --stacktrace 2>&1 | grep -v "DefaultConfigurableFileCollection" | tail -150
          exit ${PIPESTATUS[0]}
